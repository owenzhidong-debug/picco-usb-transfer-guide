<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=480, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Books — 480×800</title>
  <style>
    @font-face{font-family:PiccoSerif;src:url('./assets/bookshelf/serif-regular.woff')} 
    @font-face{font-family:PiccoSerif;src:url('./assets/bookshelf/serif-bold.woff');font-weight:700}
    @font-face{font-family:PiccoSans;src:url('./assets/bookshelf/sans-regular.woff')}
    @font-face{font-family:PiccoSans;src:url('./assets/bookshelf/sans-medium.woff');font-weight:500}
    :root{--ink:#000;--muted:#555;--line:#ddd;--paper:#fff}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:#686868}
    body{display:grid;place-items:start center;font-family:PiccoSerif,Georgia,serif;color:var(--ink);overflow:hidden}
    button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .device{position:relative;width:480px;height:800px;background:var(--paper);overflow:hidden;isolation:isolate}
    .status{height:40px;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;font:500 16px/16px PiccoSans,Arial,sans-serif}
    .status-left,.status-right{display:flex;align-items:center;gap:8px;height:24px}
    .status-left img{width:32px;height:32px}.status-right{gap:4px}.battery{width:25px;height:12px;border:2px solid #000;border-radius:2px;position:relative}.battery::after{content:"";position:absolute;width:2px;height:6px;background:#000;right:-5px;top:1px}.battery::before{content:"";position:absolute;inset:2px;background:#000}
    .topbar{height:72px;position:relative;display:flex;align-items:flex-start;justify-content:center;padding-top:16px}
    .title{font-size:36px;line-height:40px;font-weight:700;letter-spacing:-1px}
    .home,.more{position:absolute;top:12px;width:48px;height:48px;display:grid;place-items:center}.home{left:24px;border:2px solid #000;border-radius:50%}.home img{width:26px;height:26px}.more{right:24px}.dots,.dots::before,.dots::after{width:4px;height:4px;background:#000;content:"";display:block;position:absolute}.dots::before{top:-11px}.dots::after{top:11px}
    .content{position:absolute;left:0;right:0;top:112px;bottom:80px;overflow:hidden;background:#fff}
    .grid{display:grid;grid-template-columns:repeat(3,144px);grid-auto-rows:264px;column-gap:8px;row-gap:24px;padding:24px 16px 8px}
    .grid.with-path{padding-top:64px}
    .card{width:144px;height:264px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:12px;overflow:hidden}
    .cover{width:128px;height:192px;object-fit:cover;border:2px solid #000;display:block;filter:grayscale(1)}
    .card-copy{width:128px;min-width:0}.book-title{font-size:16px;font-weight:700;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.progress{font-size:16px;font-weight:700;line-height:16px;color:var(--muted);margin-top:8px}
    .list{padding:24px 24px 0;display:flex;flex-direction:column;gap:20px}
    .list-row{height:96px;display:grid;grid-template-columns:64px 1fr;gap:25px;text-align:left;align-items:center}
    .list-row .cover{width:64px;height:96px}.list-row .book-title{font-size:20px;line-height:30px}.list-row .progress{margin-top:2px}
    .path{height:64px;position:absolute;inset:0 0 auto;z-index:1;display:flex;align-items:center;padding:0 24px;font-size:20px;line-height:24px;background:#fff}
    .path button{width:40px;height:40px;margin-right:16px;font:bold 28px/40px PiccoSans,Arial;transform:rotate(-90deg)}
    .file-list{padding-top:64px}.file-row{height:88px;margin-left:24px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:40px 1fr;gap:20px;align-items:center;text-align:left}.file-row:last-child{border-bottom:0}.file-row img{width:40px;height:40px}.file-name{font-size:20px;line-height:24px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-meta{font-size:16px;line-height:20px;color:var(--muted);text-transform:uppercase;margin-top:2px}
    .folder-card .folder-art{height:192px;width:128px;display:flex;align-items:flex-end}.folder-art img{width:128px;height:128px;object-fit:contain}.folder-card .book-title{margin-top:0}
    .pager{position:absolute;left:0;bottom:0;width:480px;height:80px;border-top:1px solid #bbb;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 8px;z-index:2}.pager button{width:80px;height:80px;display:grid;place-items:center}.pager img{width:80px;height:80px}.pager button:first-child img{transform:rotate(90deg)}.pager button:last-child img{transform:rotate(-90deg)}.pager span{font-size:18px;color:var(--muted);font-weight:500}
    .panel-layer{position:absolute;inset:0;z-index:10;pointer-events:none;visibility:hidden}.panel-layer.open{pointer-events:auto;visibility:visible}.scrim{position:absolute;left:0;top:0;width:168px;height:800px;background:url('./assets/bookshelf/dither.png') repeat;opacity:.75}.panel{position:absolute;left:168px;top:0;width:312px;height:800px;background:#fff;border-left:2px solid #000;padding:0 16px;transform:translateX(312px);transition:transform .18s steps(3,end)}.open .panel{transform:none}.close{position:absolute;right:8px;top:52px;width:48px;height:48px;font:40px/48px PiccoSans,Arial}.organize{position:absolute;top:120px;left:16px;font-size:16px;line-height:20px;font-weight:700}.group{position:absolute;left:16px;width:280px}.group h2{font-size:16px;line-height:20px;margin:0 0 16px}.source{top:156px}.view{top:260px}.sort{top:400px}.order{top:628px}.panel.sd .order{top:540px}.choice-row{display:grid;grid-template-columns:132px 132px;gap:16px}.choice-row.wrap{grid-template-rows:72px 72px;row-gap:16px}.choice{height:72px;border:1px solid #000;display:grid;place-items:center;font-size:20px;line-height:25px;font-weight:700;background:#fff}.choice.active{background:#000;color:#fff}.choice.third{grid-column:1}
    .toast{position:absolute;z-index:20;left:57px;top:72px;width:317px;height:47px;padding:8px 12px;border-radius:40px;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;font:700 16px/normal PiccoSerif,Georgia,serif;text-align:center;opacity:0;pointer-events:none;transform:translateY(-8px);transition:opacity .15s,transform .15s;white-space:nowrap}.toast.show{opacity:1;transform:none}
    @media(prefers-reduced-motion:reduce){.panel,.toast{transition:none}}
  </style>
</head>
<body>
  <main class="device" id="app" aria-label="Books library prototype">
    <div class="status"><div class="status-left"><span>10:30</span><img src="./assets/bookshelf/wifi.svg" alt="Wi-Fi"><img src="./assets/bookshelf/bluetooth.svg" alt="Bluetooth"></div><div class="status-right"><span>100%</span><i class="battery" aria-hidden="true"></i></div></div>
    <header class="topbar"><button class="home" id="homeBtn" aria-label="Home"><img src="./assets/bookshelf/home.svg" alt=""></button><div class="title">Books</div><button class="more" id="moreBtn" aria-label="Organize"><i class="dots"></i></button></header>
    <section class="content" id="content" aria-live="polite"><div class="grid">
      <button class="card"><img class="cover" src="./assets/bookshelf/cover-eyes.png" alt="Book Title"><div class="card-copy"><div class="book-title">Book Titleiiiiiiiiiiiiii</div><div class="progress">12%</div></div></button>
      <button class="card"><img class="cover" src="./assets/bookshelf/cover-jane-eyre.png" alt="Jane Eyre"><div class="card-copy"><div class="book-title">Jane Eyre</div><div class="progress">76%</div></div></button>
      <button class="card"><img class="cover" src="./assets/bookshelf/cover-neverwhere.png" alt="Never Where"><div class="card-copy"><div class="book-title">Never Where</div><div class="progress">54%</div></div></button>
      <button class="card"><img class="cover" src="./assets/bookshelf/cover-night-walk.png" alt="The Shadow"><div class="card-copy"><div class="book-title">The Shadow</div><div class="progress">42%</div></div></button>
      <button class="card"><img class="cover" src="./assets/bookshelf/cover-it-follows.png" alt="It Follows"><div class="card-copy"><div class="book-title">It Follows</div><div class="progress">18%</div></div></button>
      <button class="card"><img class="cover" src="./assets/bookshelf/cover-the-wall.png" alt="The Night Walk"><div class="card-copy"><div class="book-title">The Night Walk</div><div class="progress">29%</div></div></button>
    </div></section>
    <nav class="pager" aria-label="Pages"><button id="prevPage" aria-label="Previous page"><img src="./assets/bookshelf/chevron-up.svg" alt=""></button><span id="pageCount">1/15</span><button id="nextPage" aria-label="Next page"><img src="./assets/bookshelf/chevron-down.svg" alt=""></button></nav>
    <div class="panel-layer" id="panelLayer" aria-hidden="true"><button class="scrim" id="scrim" aria-label="Close menu"></button><aside class="panel" id="panel"><button class="close" id="closeBtn" aria-label="Close">×</button><div class="organize">Organize</div><div class="group source"><div class="choice-row"><button class="choice" data-source="library">Library</button><button class="choice" data-source="sd">SD Card</button></div></div><div class="group view"><h2>View</h2><div class="choice-row"><button class="choice" data-view="grid">Grid</button><button class="choice" data-view="list">List</button></div></div><div class="group sort"><h2>Sort by</h2><div class="choice-row wrap" id="sortChoices"></div></div><div class="group order"><h2>Order</h2><div class="choice-row"><button class="choice" data-order="asc">A — Z</button><button class="choice" data-order="desc">Z — A</button></div></div></aside></div>
    <div class="toast" id="toast" role="status"></div>
  </main>
  <script>
    const A='./assets/bookshelf/';
    const library=[
      {title:'Book Titleiiiiiiiiiiiiii',progress:12,cover:'cover-eyes.png',added:6},
      {title:'Jane Eyre',progress:76,cover:'cover-jane-eyre.png',added:5},
      {title:'Never Where',progress:54,cover:'cover-neverwhere.png',added:4},
      {title:'The Shadow',progress:42,cover:'cover-night-walk.png',added:3},
      {title:'It Follows',progress:18,cover:'cover-it-follows.png',added:2},
      {title:'The Night Walk',progress:29,cover:'cover-the-wall.png',added:1}
    ];
    const files=[
      {type:'folder',title:'Folder 1'},{type:'folder',title:'Folder 2'},
      {type:'file',title:'Book namenamenamenamenamenameniiiiiiii',meta:'EPUB · 2.4 MB'},
      {type:'file',title:'The Shadow',meta:'PDF · 855 KB'},
      {type:'file',title:'The Shadow',meta:'EPUB · 2.4 MB'},
      {type:'file',title:'The Shadow',meta:'EPUB · 2.4 MB'}
    ];
    const folderBooks=[library[3],library[4],library[2],library[3],library[4],library[5]];
    const state={source:'library',view:'grid',sort:'newest',order:'asc',folder:null,page:1};
    const $=s=>document.querySelector(s), content=$('#content'), panelLayer=$('#panelLayer'), panel=$('#panel');
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function sortedBooks(items){return [...items].sort((a,b)=>{let n=['title','name'].includes(state.sort)?a.title.localeCompare(b.title):state.sort==='size'?b.progress-a.progress:b.added-a.added;return state.order==='desc'?-n:n})}
    function bookCard(b){return `<button class="card" data-open-book="${esc(b.title)}"><img class="cover" src="${A+b.cover}" alt="${esc(b.title)}"><div class="card-copy"><div class="book-title">${esc(b.title)}</div><div class="progress">${b.progress}%</div></div></button>`}
    function bookRow(b){return `<button class="list-row" data-open-book="${esc(b.title)}"><img class="cover" src="${A+b.cover}" alt="${esc(b.title)}"><div><div class="book-title">${esc(b.title)}</div><div class="progress">${b.progress}%</div></div></button>`}
    function folderCard(f){return `<button class="card folder-card" data-folder="${esc(f.title)}"><div class="folder-art"><img src="${A}folder.svg" alt=""></div><div class="book-title">${esc(f.title)}</div></button>`}
    function path(){return state.folder?`<div class="path"><button data-back aria-label="Back">⌃</button>${esc(state.folder)}</div>`:`<div class="path">/ SD Card</div>`}
    function renderLibrary(){const books=sortedBooks(library);content.innerHTML=state.view==='grid'?`<div class="grid">${books.map(bookCard).join('')}</div>`:`<div class="list">${books.slice(0,5).map(bookRow).join('')}</div>`}
    function renderSD(){
      if(state.folder){const books=sortedBooks(folderBooks);content.innerHTML=path()+(state.view==='grid'?`<div class="grid with-path">${books.map(bookCard).join('')}</div>`:`<div class="file-list">${files.slice(2).map(fileRow).join('')}</div>`);return}
      if(state.view==='list'){content.innerHTML=path()+`<div class="file-list">${files.map(fileRow).join('')}</div>`}
      else{const folders=files.filter(x=>x.type==='folder').map(folderCard).join('');content.innerHTML=path()+`<div class="grid with-path">${folders}${sortedBooks(library.slice(2,6)).map(bookCard).join('')}</div>`}
    }
    function fileRow(f){return `<button class="file-row" ${f.type==='folder'?`data-folder="${esc(f.title)}"`:`data-open-book="${esc(f.title)}"`}><img src="${A+(f.type==='folder'?'folder.svg':'book.svg')}" alt=""><div><div class="file-name">${esc(f.title)}</div>${f.meta?`<div class="file-meta">${esc(f.meta)}</div>`:''}</div></button>`}
    function render(){state.source==='library'?renderLibrary():renderSD();$('#pageCount').textContent=`${state.page}/15`;syncPanel();bindContent()}
    function bindContent(){content.querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>{state.folder=b.dataset.folder;render()});content.querySelector('[data-back]')?.addEventListener('click',()=>{state.folder=null;render()});content.querySelectorAll('[data-open-book]').forEach(b=>b.onclick=()=>notify(`Opening ${b.dataset.openBook}`))}
    function optionChanged(){render();notify('Operation successful')}
    function syncPanel(){panel.classList.toggle('sd',state.source==='sd');panel.querySelectorAll('[data-source]').forEach(b=>b.classList.toggle('active',b.dataset.source===state.source));panel.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));panel.querySelectorAll('[data-order]').forEach(b=>b.classList.toggle('active',b.dataset.order===state.order));const opts=state.source==='library'?[['newest','Newest'],['title','Title'],['added','Added']]:[['name','Name'],['size','Size']];$('#sortChoices').innerHTML=opts.map(([v,l],i)=>`<button class="choice ${i===2?'third':''} ${state.sort===v?'active':''}" data-sort="${v}">${l}</button>`).join('');$('#sortChoices').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.sort=b.dataset.sort;optionChanged()})}
    function openPanel(){syncPanel();panelLayer.classList.add('open');panelLayer.setAttribute('aria-hidden','false')}
    function closePanel(){panelLayer.classList.remove('open');panelLayer.setAttribute('aria-hidden','true')}
    function notify(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.classList.remove('show'),1200)}
    $('#moreBtn').onclick=openPanel;$('#closeBtn').onclick=closePanel;$('#scrim').onclick=closePanel;$('#homeBtn').onclick=()=>notify('Home');
    panel.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>{state.source=b.dataset.source;state.folder=null;state.sort=state.source==='library'?'newest':'name';optionChanged()});
    panel.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;optionChanged()});panel.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{state.order=b.dataset.order;optionChanged()});
    $('#prevPage').onclick=()=>{state.page=Math.max(1,state.page-1);render()};$('#nextPage').onclick=()=>{state.page=Math.min(15,state.page+1);render()};
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();if(e.key==='ArrowLeft')$('#prevPage').click();if(e.key==='ArrowRight')$('#nextPage').click()});
    render();
  </script>
</body>
</html>
