<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Picco USB 传输引导</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f4f1;
      --panel: #ffffff;
      --ink: #181818;
      --muted: #6d6d68;
      --line: #d9d9d2;
      --soft: #eeeeea;
      --accent: #111111;
      --accent-ink: #ffffff;
      --ok: #2f7d32;
      --warn: #9f5a18;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .shell {
      width: min(1040px, 100%);
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 28px;
      align-items: stretch;
    }

    .device-card,
    .guide-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.08);
    }

    .device-card {
      padding: 22px;
      display: grid;
      align-content: center;
      gap: 18px;
    }

    .device-frame {
      width: 220px;
      height: 344px;
      margin: 0 auto;
      border: 10px solid #d8d8d2;
      border-radius: 28px;
      background: #fbfbf8;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px #bdbdb6;
    }

    .device-top {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      font-size: 11px;
      font-weight: 600;
    }

    .device-content {
      padding: 18px;
      text-align: center;
      display: grid;
      gap: 16px;
      justify-items: center;
    }

    .usb-icon {
      width: 68px;
      height: 92px;
      position: relative;
      color: var(--ink);
    }

    .usb-icon::before {
      content: "";
      position: absolute;
      left: 16px;
      top: 24px;
      width: 36px;
      height: 46px;
      border: 5px solid currentColor;
      background: #fbfbf8;
    }

    .usb-icon::after {
      content: "";
      position: absolute;
      left: 23px;
      top: 2px;
      width: 22px;
      height: 22px;
      border: 5px solid currentColor;
      border-bottom: 0;
      box-shadow: inset 7px 0 0 #fbfbf8, inset -7px 0 0 #fbfbf8;
    }

    .device-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      font-weight: 700;
      line-height: 1.1;
    }

    .device-desc {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .device-button {
      width: 100%;
      min-height: 44px;
      border: 0;
      background: var(--accent);
      color: var(--accent-ink);
      border-radius: 4px;
      font-weight: 650;
      margin-top: 8px;
    }

    .guide-card {
      padding: 28px;
      min-height: 560px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 20px;
    }

    .guide-header {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 6px 0 0;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.06;
      letter-spacing: 0;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--soft);
      color: var(--muted);
      white-space: nowrap;
      font-size: 14px;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warn);
    }

    .status.is-ready .status-dot,
    .status.is-transfer .status-dot {
      background: var(--ok);
    }

    .visual {
      position: relative;
      min-height: 260px;
      display: grid;
      grid-template-columns: 150px minmax(100px, 1fr) 210px;
      gap: 18px;
      align-items: center;
      padding: 14px 0;
    }

    .node {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fbfbf8;
      padding: 18px;
      min-height: 170px;
      display: grid;
      place-items: center;
      text-align: center;
      gap: 10px;
    }

    .picco {
      width: 62px;
      height: 96px;
      border: 5px solid var(--ink);
      border-radius: 10px;
      position: relative;
      background: #fbfbf8;
      transition: background 220ms ease;
    }

    .picco::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 10px;
      width: 20px;
      height: 3px;
      border-radius: 999px;
      background: var(--ink);
      transform: translateX(-50%);
    }

    .computer {
      width: 92px;
      height: 58px;
      border: 5px solid var(--ink);
      border-radius: 6px;
      position: relative;
    }

    .computer::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -24px;
      width: 56px;
      height: 5px;
      border-radius: 999px;
      background: var(--ink);
      box-shadow: 0 -11px 0 -2px var(--ink);
      transform: translateX(-50%);
    }

    .node-label {
      font-weight: 700;
    }

    .node-state {
      color: var(--muted);
      font-size: 14px;
    }

    .cable {
      height: 8px;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
    }

    .cable::after {
      content: "";
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width 420ms ease;
    }

    .browser-card {
      display: grid;
      justify-items: stretch;
      gap: 10px;
      text-align: left;
    }

    .address {
      min-height: 34px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--soft);
      color: var(--muted);
      overflow: hidden;
      white-space: nowrap;
      font-size: 13px;
    }

    .folder {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      min-height: 50px;
      background: var(--panel);
      color: var(--muted);
    }

    .folder-icon {
      width: 30px;
      height: 22px;
      border: 3px solid currentColor;
      border-radius: 4px;
      position: relative;
    }

    .folder-icon::before {
      content: "";
      position: absolute;
      left: 2px;
      top: -9px;
      width: 16px;
      height: 8px;
      border: 3px solid currentColor;
      border-bottom: 0;
      border-radius: 4px 4px 0 0;
      background: var(--panel);
    }

    .file {
      position: absolute;
      right: 120px;
      top: 132px;
      width: 42px;
      height: 54px;
      border: 3px solid var(--ink);
      border-radius: 7px;
      background: var(--panel);
      opacity: 0;
    }

    .file::after {
      content: "";
      position: absolute;
      right: -3px;
      top: -3px;
      width: 15px;
      height: 15px;
      border-left: 3px solid var(--ink);
      border-bottom: 3px solid var(--ink);
      background: var(--bg);
    }

    .instruction {
      max-width: 620px;
      margin: 0 auto;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--soft);
    }

    .step-title {
      font-size: 21px;
      font-weight: 750;
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .step-desc {
      color: var(--muted);
      line-height: 1.55;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .action {
      min-height: 44px;
      min-width: 118px;
      padding: 0 18px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      font-weight: 700;
    }

    .action.primary {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }

    .dots {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .dot {
      height: 8px;
      border-radius: 999px;
      background: var(--line);
      transition: background 180ms ease;
    }

    .dot.active,
    .dot.done {
      background: var(--accent);
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.28);
    }

    .modal.show {
      display: grid;
    }

    .dialog {
      width: min(560px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 22px 80px rgba(0, 0, 0, 0.2);
    }

    .dialog-title {
      font-size: 19px;
      font-weight: 750;
      margin-bottom: 12px;
    }

    .fake-picker {
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      margin: 16px 0;
    }

    .picker-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
    }

    .picker-row:last-child {
      border-bottom: 0;
    }

    .picker-row.selected {
      color: var(--ink);
      background: var(--soft);
      font-weight: 700;
    }

    .is-step-1 .cable::after,
    .is-step-2 .cable::after {
      width: 100%;
    }

    .is-step-1 .picco,
    .is-step-2 .picco {
      background: var(--soft);
    }

    .is-step-2 .folder {
      color: var(--ink);
      border-color: var(--accent);
    }

    .is-transfer .file {
      animation: send-file 1.55s ease-in-out infinite;
    }

    @keyframes send-file {
      0% {
        opacity: 0;
        transform: translate(0, 0);
      }
      18% {
        opacity: 1;
      }
      78% {
        opacity: 1;
        transform: translate(-420px, 0);
      }
      100% {
        opacity: 0;
        transform: translate(-470px, 0);
      }
    }

    @media (max-width: 820px) {
      .page {
        padding: 16px;
      }

      .shell {
        grid-template-columns: 1fr;
      }

      .device-card {
        display: none;
      }

      .guide-card {
        min-height: auto;
        padding: 20px;
      }

      .guide-header {
        flex-direction: column;
      }

      .visual {
        min-height: 480px;
        grid-template-columns: 1fr;
      }

      .cable {
        width: 8px;
        height: 54px;
        justify-self: center;
      }

      .cable::after {
        width: 100%;
        height: 0;
        transition: height 420ms ease;
      }

      .is-step-1 .cable::after,
      .is-step-2 .cable::after {
        width: 100%;
        height: 100%;
      }

      .file {
        right: 50%;
        top: 350px;
      }

      @keyframes send-file {
        0% {
          opacity: 0;
          transform: translate(70px, 0);
        }
        18% {
          opacity: 1;
        }
        78% {
          opacity: 1;
          transform: translate(-22px, -218px);
        }
        100% {
          opacity: 0;
          transform: translate(-22px, -248px);
        }
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="shell" id="app">
      <aside class="device-card" aria-label="Picco 设备端提示">
        <div class="device-frame">
          <div class="device-top">
            <span>10:30</span>
            <span>100%</span>
          </div>
          <div class="device-content">
            <div class="usb-icon" aria-hidden="true"></div>
            <div class="device-title">USB 传输</div>
            <div class="device-desc">用 USB 线连接 Picco 和电脑。点击下方按钮开启 USB 传输。</div>
            <button class="device-button" type="button" id="deviceStart">开启 USB 传输</button>
          </div>
        </div>
        <div class="device-desc">左侧模拟墨水屏设备端，右侧是网页端引导。</div>
      </aside>

      <section class="guide-card" aria-label="网页端 USB 传输引导">
        <header class="guide-header">
          <div>
            <div class="eyebrow">USB Transfer Guide</div>
            <h1>USB 传输引导</h1>
          </div>
          <div class="status" id="status">
            <span class="status-dot"></span>
            <span id="statusText">等待连接</span>
          </div>
        </header>

        <div class="visual" id="visual">
          <div class="node">
            <div class="picco" aria-hidden="true"></div>
            <div>
              <div class="node-label">Picco</div>
              <div class="node-state" id="piccoState">等待 USB 连接</div>
            </div>
          </div>

          <div class="cable" aria-hidden="true"></div>

          <div class="node browser-card">
            <div class="computer" aria-hidden="true"></div>
            <div class="address">www.booxtiles.com</div>
            <div class="folder" id="folderState">
              <span class="folder-icon" aria-hidden="true"></span>
              <span>未选择 BooxTile 盘符</span>
            </div>
          </div>

          <div class="file" aria-hidden="true"></div>
        </div>

        <section class="instruction" aria-live="polite">
          <div class="step-title" id="stepTitle">1. 用 USB 线连接 Picco 和电脑</div>
          <div class="step-desc" id="stepDesc">先完成物理连接，确保这根线支持数据传输。</div>
          <div class="actions">
            <button class="action" type="button" id="prev">上一步</button>
            <button class="action primary" type="button" id="next">下一步</button>
            <button class="action primary" type="button" id="confirm" hidden>确定，选择 BooxTile 盘符</button>
          </div>
        </section>

        <div class="dots" aria-hidden="true">
          <div class="dot active"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </section>
    </section>
  </main>

  <div class="modal" id="pickerModal" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
    <div class="dialog">
      <div class="dialog-title" id="pickerTitle">选择 BooxTile 盘符</div>
      <div class="step-desc">在系统文件夹选择器中，选择名为 BooxTile 的盘符或目录。</div>
      <div class="fake-picker" aria-label="系统文件夹选择器示意">
        <div class="picker-row">📁 文稿</div>
        <div class="picker-row">📁 下载</div>
        <div class="picker-row selected">📁 BooxTile</div>
        <div class="picker-row">📁 桌面</div>
      </div>
      <div class="actions">
        <button class="action" type="button" id="cancelPicker">取消</button>
        <button class="action primary" type="button" id="selectFolder">选择</button>
      </div>
    </div>
  </div>

  <script>
    const app = document.getElementById('app');
    const visual = document.getElementById('visual');
    const status = document.getElementById('status');
    const statusText = document.getElementById('statusText');
    const piccoState = document.getElementById('piccoState');
    const folderState = document.getElementById('folderState');
    const stepTitle = document.getElementById('stepTitle');
    const stepDesc = document.getElementById('stepDesc');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    const confirm = document.getElementById('confirm');
    const pickerModal = document.getElementById('pickerModal');
    const cancelPicker = document.getElementById('cancelPicker');
    const selectFolder = document.getElementById('selectFolder');
    const deviceStart = document.getElementById('deviceStart');
    const dots = Array.from(document.querySelectorAll('.dot'));
    let step = 0;

    const steps = [
      {
        title: '1. 用 USB 线连接 Picco 和电脑',
        desc: '先完成物理连接，确保这根线支持数据传输。',
        status: '等待连接',
        picco: '等待 USB 连接'
      },
      {
        title: '2. 在 Picco 上开启 USB 传输',
        desc: '设备进入 USB 传输状态后，再回到这个网页继续操作。',
        status: '等待设备开启',
        picco: 'USB 传输待开启'
      },
      {
        title: '3. 选择 BooxTile 盘符',
        desc: '需要先选择电脑中的 BooxTile 盘符，网页才可以把图书传输到 Picco。',
        status: '等待选择盘符',
        picco: '等待网页传输'
      }
    ];

    function render() {
      app.classList.toggle('is-step-1', step >= 1);
      app.classList.toggle('is-step-2', step >= 2);
      visual.classList.remove('is-transfer');
      status.classList.toggle('is-ready', step >= 1);
      status.classList.remove('is-transfer');
      stepTitle.textContent = steps[step].title;
      stepDesc.textContent = steps[step].desc;
      statusText.textContent = steps[step].status;
      piccoState.textContent = steps[step].picco;
      next.hidden = step === steps.length - 1;
      confirm.hidden = step !== steps.length - 1;
      dots.forEach((dot, index) => {
        dot.classList.toggle('active', index === step);
        dot.classList.toggle('done', index < step);
      });
    }

    function goNext() {
      step = Math.min(steps.length - 1, step + 1);
      render();
    }

    function goPrev() {
      step = Math.max(0, step - 1);
      render();
    }

    next.addEventListener('click', goNext);
    prev.addEventListener('click', goPrev);
    deviceStart.addEventListener('click', () => {
      step = Math.max(step, 1);
      render();
    });
    confirm.addEventListener('click', () => {
      pickerModal.classList.add('show');
    });
    cancelPicker.addEventListener('click', () => {
      pickerModal.classList.remove('show');
    });
    selectFolder.addEventListener('click', () => {
      pickerModal.classList.remove('show');
      folderState.innerHTML = '<span class="folder-icon" aria-hidden="true"></span><span>已选择 BooxTile 盘符</span>';
      statusText.textContent = '可以传输';
      status.classList.add('is-transfer');
      piccoState.textContent = '正在接收文件';
      visual.classList.add('is-transfer');
      stepTitle.textContent = 'BooxTile 盘符已选择';
      stepDesc.textContent = '现在可以选择图书并传输到 Picco。传输过程中请保持 USB 连接。';
      confirm.textContent = '选择图书';
    });

    render();
  </script>
</body>
</html>
